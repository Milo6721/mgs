<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MGS Corporation</title>
<meta name="description" content="MGS Corporation – bankowość, technologia, handel, logistyka i usługi medyczne w jednym ekosystemie.">
<meta name="theme-color" content="#0a1f44">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a1f44'/%3E%3Ctext x='32' y='41' font-family='Arial' font-weight='800' font-size='24' text-anchor='middle' fill='%23fff'%3EMGS%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#eaf1fb;--text:#10213a;--muted:rgba(30,48,76,.66);--accent:#0b5fd1;--accent2:#1f8f5a;--glass:linear-gradient(145deg,rgba(255,255,255,.72),rgba(255,255,255,.34));--rim:rgba(255,255,255,.85);--shadow:0 18px 50px rgba(15,50,110,.16);--plate:#fff;--field:rgba(255,255,255,.6)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#050d1e;--text:#eaf1ff;--muted:rgba(214,226,250,.66);--accent:#4d9bff;--accent2:#43c98a;--glass:linear-gradient(145deg,rgba(255,255,255,.14),rgba(255,255,255,.05));--rim:rgba(255,255,255,.22);--shadow:0 18px 50px rgba(0,0,0,.45);--field:rgba(255,255,255,.08)}}
:root[data-theme=dark]{--bg:#050d1e;--text:#eaf1ff;--muted:rgba(214,226,250,.66);--accent:#4d9bff;--accent2:#43c98a;--glass:linear-gradient(145deg,rgba(255,255,255,.14),rgba(255,255,255,.05));--rim:rgba(255,255,255,.22);--shadow:0 18px 50px rgba(0,0,0,.45);--field:rgba(255,255,255,.08)}
*{box-sizing:border-box}html{scroll-behavior:smooth;overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:clip}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden}.bg i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55}
.b1{width:520px;height:520px;background:#2f7bff;left:-140px;top:-120px}.b2{width:460px;height:460px;background:#1fb37a;right:-120px;top:22%}.b3{width:520px;height:520px;background:#7b5cff;left:20%;bottom:-220px}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .bg i{opacity:.32}}:root[data-theme=dark] .bg i{opacity:.32}
.glass{position:relative;background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(170%);backdrop-filter:blur(26px) saturate(170%);border-radius:28px;box-shadow:var(--shadow),inset 0 1px 0 var(--rim)}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(145deg,var(--rim),transparent 40%,transparent 60%,var(--rim));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;opacity:.8}
.wrap{max-width:1120px;margin:0 auto;padding:0 18px}
header{position:sticky;top:10px;z-index:20;margin:10px auto 0;max-width:1120px;padding:0 18px}
.nav{display:flex;align-items:center;gap:6px;padding:8px 10px 8px 14px;border-radius:999px}
.nav .logo{height:34px;border-radius:8px;background:var(--plate);padding:3px 6px;display:block}
.nav .sp{flex:1}.nav a.l{padding:8px 12px;border-radius:999px;color:var(--text);text-decoration:none;font-weight:600;font-size:14px}.nav a.l:hover{background:var(--field)}
.btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 18px;border-radius:999px;border:0;background:var(--field);color:var(--text);font:inherit;font-weight:650;font-size:14px;cursor:pointer;text-decoration:none;box-shadow:inset 0 1px 0 var(--rim)}
.btn.primary{background:linear-gradient(180deg,#2d8ff0,#0a68c9);color:#fff;box-shadow:0 8px 20px rgba(11,95,209,.4),inset 0 1px 0 rgba(255,255,255,.5)}
.btn.sm{height:34px;padding:0 12px;font-size:13px}
@media (max-width:760px){.nav a.l{display:none}}
.hero{padding:70px 0 40px;text-align:center}
.hero h1{font-size:clamp(40px,8vw,76px);line-height:1.02;letter-spacing:-.035em;margin:18px 0 14px;font-weight:800}
.hero h1 span{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{max-width:720px;margin:0 auto 26px;color:var(--muted);font-size:clamp(16px,2.4vw,20px)}
.eyebrow{display:inline-block;padding:6px 14px;border-radius:999px;background:var(--field);font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--accent)}
.sectors{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:26px}.sectors span{padding:8px 16px;border-radius:999px;background:var(--field);font-weight:650;font-size:14px}
section{padding:46px 0 10px}
h2.t{font-size:clamp(28px,5vw,42px);letter-spacing:-.025em;margin:0 0 8px}.lead{color:var(--muted);max-width:760px;margin:0 0 26px;font-size:17px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.tile{padding:20px;display:flex;flex-direction:column;gap:12px;transition:transform .25s}.tile:hover{transform:translateY(-3px)}
.plate{background:var(--plate);border-radius:18px;height:124px;display:grid;place-items:center;padding:12px;overflow:hidden}.plate.dark{background:#0a1f44}
.plate img{width:100%;height:100px;object-fit:contain;display:block}.plate.cover{padding:0}.plate.cover img{height:100%;object-fit:cover}.plate.icon img{border-radius:22px;width:auto;height:96px}
.plate.mono{background:linear-gradient(145deg,#12306b,#0a1f44);color:#fff;font-weight:800;font-size:26px;letter-spacing:-.02em}
.tile h3{margin:2px 0 0;font-size:20px;letter-spacing:-.01em}.tile .sec{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent2)}
.tile p{margin:0;color:var(--muted);font-size:14.5px;flex:1}.tile .ft{display:flex;gap:8px;align-items:center}
.soon{font-size:12.5px;color:var(--muted);font-weight:600}
.two{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}@media (max-width:820px){.two{grid-template-columns:1fr}}
.card{padding:26px}.card h3{margin:0 0 8px;font-size:22px}.card p{color:var(--muted);margin:0 0 12px}
.ul{list-style:none;padding:0;margin:0;display:grid;gap:10px}.ul li{display:flex;gap:10px;color:var(--text)}.ul li::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--accent2);margin-top:9px}
.cards3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.id{padding:22px}.id .n{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}.id h3{margin:6px 0 6px;font-size:21px}.id p{margin:0;color:var(--muted);font-size:14.5px}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--field);font-size:12px;font-weight:700;color:var(--muted)}
.founder{display:flex;gap:18px;align-items:center}.av{flex:none;width:76px;height:76px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#fff;font-weight:800;font-size:30px}
.contact a.m{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:18px;background:var(--field);color:var(--text);text-decoration:none;font-weight:650;margin-bottom:10px;word-break:break-all}.contact a.m small{display:block;color:var(--muted);font-weight:500}
footer{padding:50px 0 40px;text-align:center;color:var(--muted);font-size:13.5px}
.paused{opacity:.85}

/* animacje */
@keyframes float1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(60px,40px) scale(1.12)}}
@keyframes float2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-70px,50px) scale(1.15)}}
@keyframes float3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(50px,-60px) scale(1.1)}}
.b1{animation:float1 18s ease-in-out infinite}.b2{animation:float2 22s ease-in-out infinite}.b3{animation:float3 26s ease-in-out infinite}
@keyframes shimmer{to{background-position:200% 0}}
.hero h1 span{background-size:200% 100%;background-image:linear-gradient(90deg,var(--accent),var(--accent2),#7b5cff,var(--accent));animation:shimmer 6s linear infinite}
.reveal{opacity:0;transform:translateY(26px) scale(.98);transition:opacity .7s cubic-bezier(.2,.7,.2,1) var(--d,0ms),transform .7s cubic-bezier(.2,.7,.2,1) var(--d,0ms)}
.reveal.in{opacity:1;transform:none}
#prog{position:fixed;left:0;top:0;height:3px;width:100%;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,var(--accent),var(--accent2));z-index:50}
header .nav{transition:padding .3s,box-shadow .3s,background .3s}header.sc .nav{padding-top:5px;padding-bottom:5px}
.btn{position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s}.btn:hover{transform:translateY(-2px)}.btn:active{transform:scale(.97)}
.btn.primary::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:sweep 4s ease-in-out infinite}
@keyframes sweep{0%,60%{left:-60%}100%{left:130%}}
.sectors span{animation:pop .6s both}.sectors span:nth-child(2){animation-delay:.08s}.sectors span:nth-child(3){animation-delay:.16s}.sectors span:nth-child(4){animation-delay:.24s}.sectors span:nth-child(5){animation-delay:.32s}
@keyframes pop{from{opacity:0;transform:scale(.7) translateY(10px)}}
.hero .eyebrow,.hero h1,.hero p,.hero .acts{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}.hero h1{animation-delay:.1s}.hero p{animation-delay:.2s}.hero .acts{animation-delay:.3s}
@keyframes rise{from{opacity:0;transform:translateY(30px)}}
/* pasek marek */
.marq{overflow:hidden;margin:34px -18px 0;-webkit-mask:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.mtrack{display:flex;gap:16px;width:max-content;animation:marq 38s linear infinite}.marq:hover .mtrack{animation-play-state:paused}
.mtrack .mi{flex:none;width:132px;height:72px;border-radius:18px;background:var(--plate);display:grid;place-items:center;padding:8px;box-shadow:var(--shadow);overflow:hidden}.mtrack .mi.dk{background:#0a1f44}.mtrack img{max-width:100%;max-height:56px;width:auto;height:auto;display:block;border-radius:10px}
@keyframes marq{to{transform:translateX(-50%)}}
/* statystyki */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:34px}.stat{padding:20px 12px;text-align:center}.stat b{display:block;font-size:clamp(30px,6vw,48px);letter-spacing:-.03em;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}.stat span{color:var(--muted);font-size:14px;font-weight:600}
/* orbita */
.orbwrap{display:grid;place-items:center;padding:20px 0 10px}
.orbit{--size:min(92vw,560px);--R:calc(var(--size)*.39);position:relative;width:var(--size);height:var(--size)}
.orbit .ring{position:absolute;inset:0;animation:spin 60s linear infinite}.orbit:hover .ring,.orbit:hover .ring .it i{animation-play-state:paused}
.orbit .path{position:absolute;inset:calc(50% - var(--R));border-radius:50%;border:1.5px dashed var(--rim);opacity:.7}
.orbit .it{position:absolute;left:50%;top:50%;width:0;height:0;transform:rotate(var(--a)) translateX(var(--R))}
.orbit .it i{position:absolute;left:-34px;top:-34px;width:68px;height:68px;border-radius:20px;background:var(--plate);display:grid;place-items:center;padding:7px;box-shadow:var(--shadow);animation:cspin 60s linear infinite;transform:rotate(calc(var(--a)*-1))}
.orbit .it i.dk{background:#0a1f44}.orbit .it img{max-width:100%;max-height:100%;object-fit:contain;border-radius:10px}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes cspin{from{transform:rotate(calc(var(--a)*-1))}to{transform:rotate(calc(var(--a)*-1 - 360deg))}}
.core{position:absolute;left:50%;top:50%;width:132px;height:132px;margin:-66px 0 0 -66px;border-radius:34px;background:var(--plate);display:grid;place-items:center;box-shadow:var(--shadow);z-index:2}
.core img{width:112px;height:112px;object-fit:cover;border-radius:28px}
.core::before,.core::after{content:"";position:absolute;inset:-14px;border-radius:44px;border:2px solid var(--accent);opacity:.5;animation:pulse 3.2s ease-out infinite}.core::after{animation-delay:1.6s}
@keyframes pulse{from{transform:scale(.8);opacity:.6}to{transform:scale(1.7);opacity:0}}
/* kafelki */
.tile{transform:perspective(800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .2s ease-out,box-shadow .3s;overflow:hidden}
.tile::before{content:"";position:absolute;inset:0;background:radial-gradient(260px circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.35),transparent 60%);opacity:0;transition:opacity .3s;pointer-events:none;border-radius:inherit}
.tile:hover::before{opacity:1}.tile:hover{box-shadow:0 26px 60px rgba(15,50,110,.28),inset 0 1px 0 var(--rim)}
.tile .plate img{transition:transform .4s cubic-bezier(.2,.7,.2,1)}.tile:hover .plate img{transform:scale(1.08)}
h2.t{position:relative;display:inline-block}h2.t::after{content:"";display:block;height:4px;width:0;border-radius:4px;margin-top:6px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .9s .2s cubic-bezier(.2,.7,.2,1)}.in h2.t::after,h2.t.in::after{width:64px}
.id{transition:transform .3s}.id:hover{transform:translateY(-5px)}.id .n{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;font-size:30px}
.av{animation:glow 3s ease-in-out infinite}@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(31,143,90,.5)}50%{box-shadow:0 0 0 14px rgba(31,143,90,0)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}}
@media (max-width:520px){.orbit .it i{left:-27px;top:-27px;width:54px;height:54px;padding:5px;border-radius:16px}.core{width:104px;height:104px;margin:-52px 0 0 -52px;border-radius:28px}.core img{width:88px;height:88px}}
</style>
</head>

  const OR=['medicov','dba','shop','paybud','work','payments','post','wykresy'];
  $('#ring').innerHTML=OR.map((k,i)=>`<div class="it" style="--a:${i*45}deg"><i class="${STYLE[k]==='dark'?'dk':''}"><img src="${LOGO[k]}" alt=""></i></div>`).join('');
  $('#stats').innerHTML=[BR.length,5,1].map((n,i)=>`<div class="glass stat reveal" style="--d:${i*90}ms"><b data-n="${n}">0</b><span>${esc(t.stats[i][0].replace(/^./,c=>c.toUpperCase()))}</span></div>`).join('');
  watch();
}
function watch(){
  const els=$$('.reveal,h2.t:not(.in)');
  if(!('IntersectionObserver' in window)){els.forEach(e=>e.classList.add('in'));return}
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;e.target.classList.add('in');io.unobserve(e.target);
    const n=e.target.querySelector&&e.target.querySelector('[data-n]');if(n&&!n.dataset.d){n.dataset.d=1;const to=+n.dataset.n,t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/1100);n.textContent=Math.round(to*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(t0)}}),{threshold:.15});
  els.forEach(e=>io.observe(e));
}
$('#lang').onclick=()=>{L=L==='pl'?'en':'pl';try{localStorage.setItem('mgs-lang',L)}catch(_){}render()};
$('#theme').onclick=()=>{const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dark?'light':'dark'};
$('#yr').textContent=new Date().getFullYear();render();
</script>
